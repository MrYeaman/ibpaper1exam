<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB History Paper 1 - Secure Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { user-select: none; -webkit-user-select: none; background-color: #f8fafc; }
        #exam-area, #feedback-area { display: none; }
        .source-box::-webkit-scrollbar { width: 6px; }
        .source-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        textarea { overflow: hidden; min-height: 100px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Pre-Exam Instructions -->
    <div id="setup-screen" class="max-w-md w-full bg-white p-8 rounded-xl shadow-2xl text-center border-t-8 border-red-700">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">IB History Portal</h1>
        <p class="text-xs font-semibold text-red-700 mb-6 uppercase tracking-widest">Connect to Start or View Feedback</p>
        
        <div class="mb-6 text-left">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Full Student Name / ID</label>
            <input type="text" id="student-id" class="w-full p-3 border-2 border-gray-100 rounded-lg focus:border-red-700 outline-none transition" placeholder="e.g. John Doe">
        </div>

        <button id="start-btn" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-lg transition shadow-lg">
            Enter Portal
        </button>
    </div>

    <!-- POST-EXAM FEEDBACK VIEW -->
    <div id="feedback-area" class="max-w-4xl w-full bg-white p-8 rounded-xl shadow-lg">
        <div class="flex justify-between items-start border-b pb-6 mb-8">
            <div>
                <h2 class="text-2xl font-bold text-slate-800">Exam Results & Feedback</h2>
                <p id="feedback-student-name" class="text-red-700 font-bold uppercase text-sm mt-1"></p>
            </div>
            <div class="text-right">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Final Grade</p>
                <div id="final-score-display" class="text-4xl font-black text-red-700">--/24</div>
            </div>
        </div>

        <div class="bg-blue-50 border-l-4 border-blue-500 p-6 mb-10 rounded-r-xl">
            <h3 class="text-blue-800 text-xs font-black uppercase tracking-widest mb-2">Teacher Guidance</h3>
            <p id="teacher-comments" class="text-blue-900 italic font-serif text-lg leading-relaxed"></p>
        </div>

        <div id="graded-responses" class="space-y-8 h-[50vh] overflow-y-auto pr-4 source-box">
            <!-- Student's own work will be shown here in read-only mode -->
        </div>
        
        <div class="mt-8 pt-6 border-t text-center">
            <button onclick="location.reload()" class="text-slate-400 font-bold hover:text-slate-600">Logout of Portal</button>
        </div>
    </div>

    <!-- Main Exam UI -->
    <div id="exam-area" class="max-w-7xl w-full bg-white p-8 rounded-xl shadow-lg relative">
        <div id="teacher-feedback-box" class="hidden mb-6 bg-blue-50 border-2 border-blue-400 p-4 rounded-lg flex items-start gap-4">
            <div class="flex-1">
                <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1">Live Message from Teacher:</p>
                <p id="live-feedback-text" class="text-blue-900 font-bold italic"></p>
            </div>
            <button onclick="this.parentElement.classList.add('hidden')" class="text-blue-400 hover:text-blue-600 font-bold">&times;</button>
        </div>

        <div class="flex justify-between items-center mb-6 border-b pb-4 sticky top-0 bg-white z-10">
            <div>
                <h2 class="text-lg font-bold text-gray-800">Paper 1: The Move to Global War</h2>
                <p id="display-student-name" class="text-xs text-red-700 font-bold uppercase"></p>
            </div>
            <div id="timer-display" class="text-2xl font-mono font-bold bg-gray-100 px-6 py-2 rounded-lg border-2 border-gray-200">60:00</div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
            <div class="lg:col-span-2 bg-gray-50 p-6 rounded-lg border border-gray-200 overflow-y-auto h-[60vh] source-box">
                <h3 class="text-xs font-bold uppercase text-gray-400 mb-4 tracking-wider">Resource Booklet</h3>
                <p class="text-sm italic text-gray-700 leading-relaxed bg-white p-4 rounded shadow-sm border-l-4 border-gray-300">
                    Sources A, B, and C are available for analysis...
                </p>
            </div>

            <div id="question-container" class="lg:col-span-3 space-y-8 h-[60vh] overflow-y-auto pr-4 source-box">
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <label class="font-bold text-gray-800 block mb-2">Q1a [3m]</label>
                    <textarea data-qid="q1a" class="auto-expand w-full p-4 border rounded-md bg-slate-50 font-serif outline-none" placeholder="Write response..."></textarea>
                </div>
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <label class="font-bold text-gray-800 block mb-2">Q1b [2m]</label>
                    <textarea data-qid="q1b" class="auto-expand w-full p-4 border rounded-md bg-slate-50 font-serif outline-none" placeholder="Write response..."></textarea>
                </div>
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <label class="font-bold text-gray-800 block mb-2">Q2 [4m]</label>
                    <textarea data-qid="q2" class="auto-expand w-full p-4 border rounded-md bg-slate-50 font-serif outline-none" placeholder="Write response..."></textarea>
                </div>
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <label class="font-bold text-gray-800 block mb-2">Q3 [6m]</label>
                    <textarea data-qid="q3" class="auto-expand w-full p-4 border rounded-md bg-slate-50 font-serif outline-none" placeholder="Write response..."></textarea>
                </div>
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                    <label class="font-bold text-gray-800 block mb-2">Q4 [9m]</label>
                    <textarea data-qid="q4" class="auto-expand w-full p-4 border rounded-md bg-slate-50 font-serif outline-none" placeholder="Write response..."></textarea>
                </div>
            </div>
        </div>

        <div class="mt-6 flex justify-between items-center border-t pt-4">
            <div class="text-gray-400 text-xs font-bold">Word Count: <span id="total-word-count" class="text-red-700">0</span> | <span id="save-status">Synced</span></div>
            <button id="submit-btn" class="bg-red-800 text-white px-12 py-3 rounded font-bold transition shadow-lg hover:bg-black">Finalize & Submit</button>
        </div>
    </div>

    <!-- Overlays -->
    <div id="confirm-modal" class="fixed inset-0 bg-gray-900 bg-opacity-80 z-[60] hidden flex items-center justify-center p-6 text-center">
        <div class="bg-white p-8 rounded-xl max-w-md w-full border-t-8 border-yellow-500">
            <h2 class="text-2xl font-bold mb-4">Final Submission?</h2>
            <div class="flex gap-4">
                <button onclick="document.getElementById('confirm-modal').classList.add('hidden')" class="flex-1 bg-gray-200 py-3 rounded font-bold">Back</button>
                <button id="confirm-final-submit" class="flex-1 bg-red-700 text-white py-3 rounded font-bold">Submit</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSNhgsM-UXpe8XmsW2hj4lAHD3TW6bg7w",
            authDomain: "ib-paper-1-exams.firebaseapp.com",
            projectId: "ib-paper-1-exams",
            storageBucket: "ib-paper-1-exams.firebasestorage.app",
            messagingSenderId: "452822797263",
            appId: "1:452822797263:web:f74698a79ed6692c7720ba"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'ib-history-portal';

        let isExamActive = false;
        let timeLeft = 60 * 60;
        let currentSessionId = null;
        let timerInterval;

        document.getElementById('start-btn').addEventListener('click', async () => {
            const name = document.getElementById('student-id').value.trim();
            if (!name) return alert("Enter name.");

            await signInAnonymously(auth);
            
            // CHECK FOR EXISTING SUBMISSION FIRST
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'submissions'), where("studentName", "==", name));
            const querySnapshot = await getDocs(q);
            
            let existingSubmission = null;
            querySnapshot.forEach((doc) => { if (doc.data().status.includes("FINAL")) existingSubmission = doc.data(); });

            if (existingSubmission) {
                showFeedback(existingSubmission);
            } else {
                startExam(name);
            }
        });

        function showFeedback(data) {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('feedback-area').style.display = 'block';
            document.getElementById('feedback-student-name').innerText = data.studentName;
            document.getElementById('final-score-display').innerText = (data.finalGrade || "--") + "/24";
            document.getElementById('teacher-comments').innerText = data.teacherFeedback || "No feedback provided yet.";
            
            const container = document.getElementById('graded-responses');
            container.innerHTML = '';
            const labels = { q1a: "Q1a", q1b: "Q1b", q2: "Q2", q3: "Q3", q4: "Q4" };
            Object.entries(labels).forEach(([qid, label]) => {
                const text = data.responses?.[qid] || 'No response.';
                container.innerHTML += `<div class="mb-6"><h4 class="text-xs font-black text-slate-400 mb-2 uppercase">${label}</h4><div class="bg-slate-50 p-4 border rounded font-serif text-slate-700">${text.replace(/\n/g,'<br>')}</div></div>`;
            });
        }

        async function startExam(name) {
            currentSessionId = `${name.replace(/\s+/g, '_')}_${Date.now()}`;
            document.documentElement.requestFullscreen().then(() => {
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('exam-area').style.display = 'block';
                document.getElementById('display-student-name').innerText = name;
                isExamActive = true;
                cloudSave("Exam Started");
                startTimer();
                
                // Watch for Live Feedback
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', currentSessionId), (snap) => {
                    if (snap.exists() && snap.data().teacherFeedback) {
                        document.getElementById('teacher-feedback-box').classList.remove('hidden');
                        document.getElementById('live-feedback-text').innerText = snap.data().teacherFeedback;
                    }
                });

                setInterval(() => { if (isExamActive) cloudSave("Auto-save"); }, 30000);
            });
        }

        async function cloudSave(reason) {
            if (!isExamActive && !reason.includes("FINAL")) return;
            const res = {};
            document.querySelectorAll('textarea[data-qid]').forEach(ta => res[ta.getAttribute('data-qid')] = ta.value);
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', currentSessionId), {
                    studentName: document.getElementById('student-id').value,
                    timestamp: serverTimestamp(),
                    status: reason,
                    totalWords: document.getElementById('total-word-count').innerText,
                    responses: res
                }, { merge: true });
                document.getElementById('save-status').innerText = "Synced";
            } catch (e) { document.getElementById('save-status').innerText = "Sync Error"; }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (isExamActive) {
                    timeLeft--;
                    const m = Math.floor(timeLeft/60), s = timeLeft%60;
                    document.getElementById('timer-display').innerText = `${m}:${s<10?'0':''}${s}`;
                    if (timeLeft <= 0) forceSubmit("Time Expired");
                }
            }, 1000);
        }

        function forceSubmit(reason) {
            isExamActive = false;
            clearInterval(timerInterval);
            cloudSave(`FINAL: ${reason}`).then(() => location.reload());
        }

        document.getElementById('submit-btn').onclick = () => document.getElementById('confirm-modal').classList.remove('hidden');
        document.getElementById('confirm-final-submit').onclick = () => forceSubmit("Manual Submission");
        
        document.querySelectorAll('textarea').forEach(ta => {
            ta.oninput = () => {
                let total = 0;
                document.querySelectorAll('textarea').forEach(t => total += t.value.trim().split(/\s+/).filter(w => w.length > 0).length);
                document.getElementById('total-word-count').innerText = total;
            };
        });
        
        document.addEventListener('visibilitychange', () => { if (document.hidden && isExamActive) forceSubmit("Tab Switch Violation"); });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB History - Teacher Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        #modal-content::-webkit-scrollbar { width: 8px; }
        #modal-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        body { background-color: #020617; }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-6 font-sans">

    <header class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-end border-b border-slate-800 pb-6 gap-4">
        <div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Exam Control Tower</h1>
            <p class="text-slate-500 font-medium tracking-wide">IB History Paper 1: Assessment Mode</p>
        </div>
        <div class="flex gap-4">
            <button id="export-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-bold transition flex items-center gap-2 shadow-lg text-sm">
                Export CSV
            </button>
            <div class="bg-slate-900 px-6 py-2 rounded-lg border border-slate-800 text-center">
                <span class="text-[10px] text-slate-500 block uppercase font-black tracking-widest leading-none mb-1">Students Connected</span>
                <span id="active-count" class="text-2xl font-mono font-bold text-blue-400">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        <div id="student-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <div id="view-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white text-slate-900 w-full max-w-6xl h-[92vh] rounded-2xl overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <div>
                    <h2 id="modal-student-name" class="text-2xl font-bold text-slate-800 tracking-tight">Student Name</h2>
                    <p id="modal-meta" class="text-xs text-slate-400 font-mono mt-1 uppercase tracking-tighter"></p>
                </div>
                <button id="close-modal" class="text-3xl font-light text-slate-400 hover:text-red-500 transition-colors">&times;</button>
            </div>
            
            <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
                <!-- Response View -->
                <div id="modal-content" class="flex-1 p-8 overflow-y-auto space-y-10 font-serif text-lg leading-relaxed bg-white border-r"></div>
                
                <!-- Assessment Sidebar -->
                <div class="w-full md:w-96 bg-slate-50 p-6 flex flex-col border-t md:border-t-0 overflow-y-auto">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 mb-4">Post-Exam Assessment</h3>
                    
                    <div class="mb-4">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Final Score (/24)</label>
                        <input type="number" id="grade-input" class="w-full p-3 border rounded-xl text-xl font-bold focus:ring-2 focus:ring-red-500 outline-none" placeholder="0">
                    </div>

                    <div class="flex-1 flex flex-col min-min-h-[200px]">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Teacher Feedback & Guidance</label>
                        <textarea id="feedback-input" class="flex-1 w-full p-4 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none mb-4" placeholder="Provide detailed feedback for the student to see when they log back in..."></textarea>
                    </div>

                    <button id="send-feedback-btn" class="w-full bg-red-700 text-white font-bold py-4 rounded-xl hover:bg-red-800 transition shadow-lg uppercase tracking-widest text-sm">Save & Send Assessment</button>
                    <p id="feedback-status" class="text-[10px] text-center mt-3 text-slate-400 italic"></p>
                    
                    <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-100">
                        <p class="text-[10px] text-blue-600 font-bold leading-tight italic">Students will see this feedback the next time they open their portal.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSNhgsM-UXpe8XmsW2hj4lAHD3TW6bg7w",
            authDomain: "ib-paper-1-exams.firebaseapp.com",
            projectId: "ib-paper-1-exams",
            storageBucket: "ib-paper-1-exams.firebasestorage.app",
            messagingSenderId: "452822797263",
            appId: "1:452822797263:web:f74698a79ed6692c7720ba"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'ib-history-portal';
        let allData = [];
        let currentOpenStudentId = null;

        async function init() {
            await signInAnonymously(auth);
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'submissions'));
            onSnapshot(q, (snapshot) => {
                allData = [];
                snapshot.forEach(doc => allData.push({ id: doc.id, ...doc.data() }));
                renderDashboard();
            });
        }

        function renderDashboard() {
            const grid = document.getElementById('student-grid');
            document.getElementById('active-count').innerText = allData.length;
            grid.innerHTML = '';
            
            allData.sort((a, b) => (a.studentName || '').localeCompare(b.studentName || ''));

            allData.forEach(student => {
                const isFinal = (student.status || '').includes('FINAL');
                const hasGrade = student.finalGrade !== undefined;
                const card = document.createElement('div');
                card.className = `p-6 rounded-xl border transition-all cursor-pointer ${hasGrade ? 'bg-slate-800 border-emerald-500' : 'bg-slate-900 border-slate-800'} hover:border-blue-500`;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold text-white truncate">${student.studentName || 'Anonymous'}</h3>
                        <span class="text-[10px] font-black uppercase ${hasGrade ? 'bg-emerald-600' : 'bg-blue-600'} px-2 py-1 rounded">
                            ${hasGrade ? 'Graded: ' + student.finalGrade + '/24' : student.totalWords + ' Words'}
                        </span>
                    </div>
                    <p class="text-[10px] text-slate-500 mt-2 uppercase tracking-widest">${student.status || 'Active'}</p>
                `;
                card.onclick = () => openModal(student);
                grid.appendChild(card);
            });
        }

        function openModal(student) {
            currentOpenStudentId = student.id;
            const modal = document.getElementById('view-modal');
            const content = document.getElementById('modal-content');
            document.getElementById('modal-student-name').innerText = student.studentName;
            document.getElementById('feedback-input').value = student.teacherFeedback || "";
            document.getElementById('grade-input').value = student.finalGrade || "";
            document.getElementById('feedback-status').innerText = "";
            document.getElementById('modal-meta').innerText = `Session: ${student.id} | Status: ${student.status}`;
            
            content.innerHTML = '';
            const labels = { q1a: "Question 1a", q1b: "Question 1b", q2: "Question 2", q3: "Question 3", q4: "Question 4" };
            Object.entries(labels).forEach(([qid, label]) => {
                const text = student.responses?.[qid] || '';
                content.innerHTML += `
                    <div class="mb-10">
                        <h4 class="text-blue-800 text-xs font-black uppercase tracking-widest mb-4">${label}</h4>
                        <div class="bg-slate-50 p-6 rounded-xl text-slate-800 border leading-relaxed shadow-inner">
                            ${text.replace(/\n/g, '<br>') || '<span class="text-slate-300">No response.</span>'}
                        </div>
                    </div>`;
            });

            modal.classList.remove('hidden');
        }

        document.getElementById('send-feedback-btn').onclick = async () => {
            if (!currentOpenStudentId) return;
            const text = document.getElementById('feedback-input').value;
            const grade = document.getElementById('grade-input').value;
            const status = document.getElementById('feedback-status');
            status.innerText = "Saving Assessment...";
            
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', currentOpenStudentId), {
                    teacherFeedback: text,
                    finalGrade: grade,
                    assessedAt: new Date().getTime()
                });
                status.innerText = "Assessment saved! Student can now view this.";
            } catch (e) {
                status.innerText = "Error saving.";
            }
        };

        document.getElementById('close-modal').onclick = () => document.getElementById('view-modal').classList.add('hidden');
        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB History - Teacher Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        #modal-content::-webkit-scrollbar { width: 8px; }
        #modal-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        body { background-color: #020617; }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-6 font-sans">

    <header class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-end border-b border-slate-800 pb-6 gap-4">
        <div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Exam Control Tower</h1>
            <p class="text-slate-500 font-medium tracking-wide">IB History Paper 1: Assessment Mode</p>
        </div>
        <div class="flex gap-4">
            <button id="export-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-bold transition flex items-center gap-2 shadow-lg text-sm">
                Export CSV
            </button>
            <div class="bg-slate-900 px-6 py-2 rounded-lg border border-slate-800 text-center">
                <span class="text-[10px] text-slate-500 block uppercase font-black tracking-widest leading-none mb-1">Students Connected</span>
                <span id="active-count" class="text-2xl font-mono font-bold text-blue-400">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        <div id="student-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <div id="view-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-100 text-slate-900 w-full max-w-7xl h-[95vh] rounded-2xl overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center bg-white shadow-sm z-10">
                <div>
                    <h2 id="modal-student-name" class="text-2xl font-bold text-slate-800 tracking-tight">Student Name</h2>
                    <p id="modal-meta" class="text-xs text-slate-400 font-mono mt-1 uppercase tracking-tighter"></p>
                </div>
                <div class="flex items-center gap-4">
                    <button id="download-modal-btn" class="text-sm font-bold text-slate-500 hover:text-blue-600 flex items-center gap-1 transition-colors" title="Download Text File">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                        Download
                    </button>
                    <button id="print-modal-btn" class="text-sm font-bold text-slate-500 hover:text-blue-600 flex items-center gap-1 transition-colors" title="Print Submission">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v3a2 2 0 002 2h1v2a2 2 0 002 2h6a2 2 0 002-2v-2h1a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd" /></svg>
                        Print
                    </button>
                    <button id="close-modal" class="text-3xl font-light text-slate-400 hover:text-red-500 transition-colors ml-2">&times;</button>
                </div>
            </div>
            
            <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
                <!-- Response View (Left Side) -->
                <div id="modal-content" class="flex-1 p-8 overflow-y-auto space-y-8 text-lg bg-slate-50 border-r border-slate-200">
                    <!-- Individual questions and grading inputs get injected here -->
                </div>
                
                <!-- Assessment Sidebar (Right Side) -->
                <div class="w-full md:w-96 bg-white p-6 flex flex-col border-t md:border-t-0 overflow-y-auto shadow-[-4px_0_15px_rgba(0,0,0,0.05)]">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 mb-6 border-b pb-2">Overall Assessment</h3>
                    
                    <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Total Score (/24)</label>
                        <div class="flex items-center gap-2">
                            <input type="number" id="grade-input" class="w-24 p-3 border rounded-lg text-2xl font-black text-red-700 focus:ring-2 focus:ring-red-500 outline-none text-center" placeholder="0">
                            <span class="text-sm font-bold text-slate-400">/ 24 marks</span>
                        </div>
                        <p class="text-[9px] text-slate-400 mt-2 uppercase font-bold italic">*Auto-calculated from questions</p>
                    </div>

                    <div class="flex-1 flex flex-col min-h-[200px] mb-6">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">General Overall Feedback</label>
                        <textarea id="feedback-input" class="w-full p-4 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none overflow-hidden min-h-[150px]" placeholder="Provide general feedback on their overall performance..."></textarea>
                    </div>

                    <button id="send-feedback-btn" class="w-full bg-red-700 text-white font-black py-4 rounded-xl hover:bg-red-800 transition shadow-lg uppercase tracking-widest text-sm">Save & Send Assessment</button>
                    <p id="feedback-status" class="text-[11px] font-bold text-center mt-3 text-emerald-600"></p>
                    
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSNhgsM-UXpe8XmsW2hj4lAHD3TW6bg7w",
            authDomain: "ib-paper-1-exams.firebaseapp.com",
            projectId: "ib-paper-1-exams",
            storageBucket: "ib-paper-1-exams.firebasestorage.app",
            messagingSenderId: "452822797263",
            appId: "1:452822797263:web:f74698a79ed6692c7720ba"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'ib-history-portal';
        let allData = [];
        let currentOpenStudentId = null;
        let currentStudentData = null;

        async function init() {
            await signInAnonymously(auth);
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'submissions'));
            onSnapshot(q, (snapshot) => {
                allData = [];
                snapshot.forEach(doc => allData.push({ id: doc.id, ...doc.data() }));
                renderDashboard();
            });
        }

        function renderDashboard() {
            const grid = document.getElementById('student-grid');
            document.getElementById('active-count').innerText = allData.length;
            grid.innerHTML = '';
            
            allData.sort((a, b) => (a.studentName || '').localeCompare(b.studentName || ''));

            allData.forEach(student => {
                const hasGrade = student.finalGrade !== undefined && student.finalGrade !== "";
                const card = document.createElement('div');
                card.className = `p-6 rounded-xl border transition-all cursor-pointer ${hasGrade ? 'bg-slate-800 border-emerald-500' : 'bg-slate-900 border-slate-800'} hover:border-blue-500`;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold text-white truncate">${student.studentName || 'Anonymous'}</h3>
                        <span class="text-[10px] font-black uppercase ${hasGrade ? 'bg-emerald-600' : 'bg-blue-600'} px-2 py-1 rounded">
                            ${hasGrade ? 'Graded: ' + student.finalGrade + '/24' : student.totalWords + ' Words'}
                        </span>
                    </div>
                    <p class="text-[10px] text-slate-500 mt-2 uppercase tracking-widest">${student.status || 'Active'}</p>
                `;
                card.onclick = () => openModal(student);
                grid.appendChild(card);
            });
        }

        function openModal(student) {
            currentOpenStudentId = student.id;
            currentStudentData = student;
            const modal = document.getElementById('view-modal');
            const content = document.getElementById('modal-content');
            
            // Set Sidebar Overall Data
            document.getElementById('modal-student-name').innerText = student.studentName;
            document.getElementById('feedback-input').value = student.teacherFeedback || "";
            document.getElementById('grade-input').value = student.finalGrade || "";
            document.getElementById('feedback-status').innerText = "";
            document.getElementById('modal-meta').innerText = `Session: ${student.id} | Status: ${student.status}`;
            
            content.innerHTML = '';
            const labels = { 
                q1a: { name: "Question 1a (Document)", max: 3 }, 
                q1b: { name: "Question 1b (Cartoon/Map)", max: 2 }, 
                q2: { name: "Question 2 (OPVL)", max: 4 }, 
                q3: { name: "Question 3 (Compare/Contrast)", max: 6 }, 
                q4: { name: "Question 4 (Synthesis)", max: 9 } 
            };

            // Generate each question with individual grading tools
            Object.entries(labels).forEach(([qid, info]) => {
                const text = student.responses?.[qid] || '';
                const qData = student.questionAssessments?.[qid] || {};
                const qScore = qData.score !== undefined ? qData.score : '';
                const qFeed = qData.feedback || '';

                content.innerHTML += `
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center mb-4 border-b pb-2">
                            <h4 class="text-blue-800 text-sm font-black uppercase tracking-widest">${info.name}</h4>
                            <span class="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">Max: ${info.max}m</span>
                        </div>
                        <div class="font-serif text-slate-700 leading-relaxed mb-6 whitespace-pre-wrap">${text || '<span class="text-slate-300 italic">No response provided.</span>'}</div>
                        
                        <div class="bg-blue-50/50 p-4 rounded-lg border border-blue-100 flex flex-col md:flex-row gap-4">
                            <div class="w-full md:w-24">
                                <label class="block text-[10px] font-black text-blue-800 uppercase mb-1">Score</label>
                                <input type="number" id="score-${qid}" value="${qScore}" min="0" max="${info.max}" class="q-score-input w-full p-2 border border-blue-200 rounded text-center font-bold text-blue-900 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="/${info.max}">
                            </div>
                            <div class="flex-1">
                                <label class="block text-[10px] font-black text-blue-800 uppercase mb-1">Specific Feedback (Optional)</label>
                                <textarea id="feedback-${qid}" class="w-full p-2 border border-blue-200 rounded text-sm text-blue-900 focus:ring-2 focus:ring-blue-500 outline-none resize-none overflow-hidden" rows="2" placeholder="Feedback for just this question...">${qFeed}</textarea>
                            </div>
                        </div>
                    </div>`;
            });

            // Auto-Calculate Total Score Feature & Auto-Expand Textareas
            setTimeout(() => {
                const scoreInputs = document.querySelectorAll('.q-score-input');
                scoreInputs.forEach(input => {
                    input.addEventListener('input', () => {
                        let total = 0;
                        scoreInputs.forEach(inp => { total += Number(inp.value) || 0; });
                        document.getElementById('grade-input').value = total;
                    });
                });

                // Auto-expand all feedback textareas
                const textareas = document.querySelectorAll('textarea[id^="feedback-"]');
                textareas.forEach(ta => {
                    // Initial resize for loaded content
                    ta.style.height = 'auto';
                    ta.style.height = ta.scrollHeight + 'px';
                    
                    // Resize dynamically on input
                    ta.addEventListener('input', function() {
                        this.style.height = 'auto';
                        this.style.height = this.scrollHeight + 'px';
                    });
                });
            }, 100);

            modal.classList.remove('hidden');
        }

        document.getElementById('send-feedback-btn').onclick = async () => {
            if (!currentOpenStudentId) return;
            const status = document.getElementById('feedback-status');
            status.innerText = "Saving Assessment...";
            
            // Gather all individual question assessments
            const questionAssessments = {};
            ['q1a', 'q1b', 'q2', 'q3', 'q4'].forEach(qid => {
                questionAssessments[qid] = {
                    score: document.getElementById(`score-${qid}`).value,
                    feedback: document.getElementById(`feedback-${qid}`).value
                };
            });

            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', currentOpenStudentId), {
                    teacherFeedback: document.getElementById('feedback-input').value,
                    finalGrade: document.getElementById('grade-input').value,
                    questionAssessments: questionAssessments,
                    assessedAt: new Date().getTime()
                });
                status.innerText = "✓ Saved & Sent to Student!";
                setTimeout(() => { status.innerText = ""; }, 3000);
            } catch (e) {
                status.innerText = "Error saving data.";
            }
        };

        document.getElementById('close-modal').onclick = () => document.getElementById('view-modal').classList.add('hidden');
        
        // --- PRINT AND DOWNLOAD LOGIC ---
        function getCurrentAssessmentData() {
            const data = {
                finalGrade: document.getElementById('grade-input').value,
                teacherFeedback: document.getElementById('feedback-input').value,
                questions: {}
            };
            ['q1a', 'q1b', 'q2', 'q3', 'q4'].forEach(qid => {
                data.questions[qid] = {
                    score: document.getElementById(`score-${qid}`).value,
                    feedback: document.getElementById(`feedback-${qid}`).value
                };
            });
            return data;
        }

        document.getElementById('print-modal-btn').onclick = () => {
            if(!currentStudentData) return;
            const assessData = getCurrentAssessmentData();
            const labels = { q1a: { name: "Q1a", max: 3 }, q1b: { name: "Q1b", max: 2 }, q2: { name: "Q2", max: 4 }, q3: { name: "Q3", max: 6 }, q4: { name: "Q4", max: 9 } };
            
            let html = `<html><head><title>Exam: ${currentStudentData.studentName}</title><style>body{font-family:sans-serif; padding:20px; color:#333; line-height:1.6;} .header{border-bottom:2px solid #ccc; padding-bottom:10px; margin-bottom:20px;} h1{margin:0; font-size:24px;} .grade{font-size:20px; font-weight:bold; color:#b91c1c;} .overall-fb{background:#f8fafc; padding:15px; border-left:4px solid #3b82f6; margin-bottom:30px;} .q-box{margin-bottom:25px;} .q-title{font-weight:bold; font-size:14px; text-transform:uppercase; color:#1e40af; margin-bottom:5px;} .q-score{font-weight:bold; color:#b91c1c;} .q-answer{font-family:serif; font-size:16px; margin:10px 0; padding:15px; border:1px solid #e2e8f0; background-color:#fff;} .q-fb{background:#eff6ff; padding:10px; font-size:14px; font-style:italic;}</style></head><body>`;
            
            html += `<div class="header"><h1>${currentStudentData.studentName}</h1><p>Status: ${currentStudentData.status}</p><p class="grade">Total Score: ${assessData.finalGrade || '--'} / 24</p></div>`;
            if (assessData.teacherFeedback) {
                html += `<div><strong>Overall Feedback:</strong><div class="overall-fb">${assessData.teacherFeedback.replace(/\n/g, '<br>')}</div></div>`;
            }
            
            Object.entries(labels).forEach(([qid, info]) => {
                const ans = currentStudentData.responses?.[qid] || 'No response.';
                const score = assessData.questions[qid].score || '--';
                const fb = assessData.questions[qid].feedback;
                html += `<div class="q-box"><div class="q-title">${info.name} - Score: <span class="q-score">${score} / ${info.max}</span></div>`;
                html += `<div class="q-answer">${ans.replace(/\n/g, '<br>')}</div>`;
                if(fb) html += `<div class="q-fb">Teacher Notes: ${fb.replace(/\n/g, '<br>')}</div>`;
                html += `</div>`;
            });
            
            html += `</body></html>`;
            const printWindow = window.open('', '', 'height=800,width=800');
            printWindow.document.write(html);
            printWindow.document.close();
            setTimeout(() => { printWindow.print(); printWindow.close(); }, 250);
        };

        document.getElementById('download-modal-btn').onclick = () => {
            if(!currentStudentData) return;
            const assessData = getCurrentAssessmentData();
            const labels = { q1a: { name: "Question 1a", max: 3 }, q1b: { name: "Question 1b", max: 2 }, q2: { name: "Question 2", max: 4 }, q3: { name: "Question 3", max: 6 }, q4: { name: "Question 4", max: 9 } };
            
            let text = `IB HISTORY EXAM SUBMISSION\n`;
            text += `=========================================\n`;
            text += `Student Name : ${currentStudentData.studentName}\n`;
            text += `Status       : ${currentStudentData.status}\n`;
            text += `Total Score  : ${assessData.finalGrade || '--'} / 24\n`;
            text += `=========================================\n\n`;
            
            if (assessData.teacherFeedback) {
                text += `OVERALL FEEDBACK:\n${assessData.teacherFeedback}\n\n-----------------------------------------\n\n`;
            }

            Object.entries(labels).forEach(([qid, info]) => {
                const ans = currentStudentData.responses?.[qid] || 'No response.';
                const score = assessData.questions[qid].score || '--';
                const fb = assessData.questions[qid].feedback;
                
                text += `${info.name.toUpperCase()} (Score: ${score} / ${info.max})\n`;
                text += `STUDENT ANSWER:\n${ans}\n\n`;
                if(fb) { text += `TEACHER NOTES:\n${fb}\n\n`; }
                text += `-----------------------------------------\n\n`;
            });

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Submission_${currentStudentData.studentName.replace(/\s+/g, '_')}.txt`;
            link.click();
        };

        // Update Export CSV to include Total Grade
        document.getElementById('export-btn').onclick = () => {
            if (allData.length === 0) return alert("No data");
            let csv = "Name,Status,Total Grade,Words,Q1a,Q1b,Q2,Q3,Q4\n";
            allData.forEach(r => {
                csv += `"${r.studentName}","${r.status}","${r.finalGrade||''}","${r.totalWords}","${(r.responses?.q1a||'').replace(/"/g,'""')}","${(r.responses?.q1b||'').replace(/"/g,'""')}","${(r.responses?.q2||'').replace(/"/g,'""')}","${(r.responses?.q3||'').replace(/"/g,'""')}","${(r.responses?.q4||'').replace(/"/g,'""')}"\n`;
            });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            link.download = `IB_History_Results.csv`;
            link.click();
        };

        init();
    </script>
</body>
</html>
